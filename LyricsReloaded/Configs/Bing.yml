name: Bing
loader: static

variables:
    artist:
        type: artist
        filters:
        - lowercase
        
    title:
        type: title
        filters: artist

headers:
    user-agent: 'Mozilla/5.0 (Windows NT 6.3; WOW64; rv:30.0) Gecko/20100101 Firefox/30.0' # Firefox 30 Win x64 user agent

config:
    url: "https://www.bing.com/search?q={title}+{artist}+lyrics&form=QBLH"
    pattern: ['<div class="lyrics">(?<lyrics>.*?)Songwriters', 's']

post-filters:
- utf8_encode
- entity_decode
- br2nl
- strip_html
- trim